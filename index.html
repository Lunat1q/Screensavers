<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Screensavers</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
            z-index: 10;
            min-width: 300px;
            border: 1px solid #333;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        h2 {
            margin-top: 0;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        select, input[type="color"], button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }
        input[type="color"] {
            padding: 5px;
            height: 50px;
            cursor: pointer;
        }
        .setting-group {
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 15px;
            display: none;
        }
        .setting-group.active {
            display: block;
        }
        .setting-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .setting-row label {
            margin-bottom: 0;
            flex: 1;
            font-size: 13px;
        }
        .setting-row input[type="range"] {
            flex: 1;
            width: auto;
            padding: 0;
            cursor: pointer;
        }
        button {
            background: #007bff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #0056b3;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<div id="ui">
    <h2>Screensaver Settings</h2>
    
    <div class="form-group">
        <label for="typeSelect">Animation Type</label>
        <select id="typeSelect">
            <option value="solid">Solid Color</option>
            <option value="slow">Constellation Orbs</option>
            <option value="mesmerizing">Complex Harmonograph</option>
            <option value="flow">Vector Flow Field</option>
            <option value="cosmic">Cosmic Warp</option>
            <option value="win11">Windows 11 Update</option>
            <option value="matrix">Digital Rain</option>
            <option value="neon">Neon Waves</option>
            <option value="fireworks">Fireworks</option>
            <option value="bouncing">Bouncing Text</option>
            <option value="synthwave">Synthwave Grid</option>
            <option value="tunnel">Cyber Tunnel</option>
            <option value="ripples">Water Ripples</option>
        </select>
    </div>

    <div class="form-group">
        <label for="colorPicker">Base Color Palette</label>
        <input type="color" id="colorPicker" value="#00d2ff">
    </div>

    <!-- Settings Containers -->
    <div id="settings-slow" class="setting-group">
        <div class="setting-row">
            <label>Orb Density</label>
            <input type="range" id="slowCount" min="0.2" max="3" step="0.2" value="1">
        </div>
        <div class="setting-row">
            <label>Movement Speed</label>
            <input type="range" id="slowSpeed" min="0.1" max="4" step="0.1" value="1">
        </div>
    </div>
    <div id="settings-mesmerizing" class="setting-group">
        <div class="setting-row">
            <label>Rotation Speed</label>
            <input type="range" id="mesmSpeed" min="0.1" max="4" step="0.1" value="1">
        </div>
        <div class="setting-row">
            <label>Complexity</label>
            <input type="range" id="mesmComplexity" min="3" max="15" step="1" value="5">
        </div>
    </div>
    <div id="settings-flow" class="setting-group">
        <div class="setting-row">
            <label>Particle Density</label>
            <input type="range" id="flowCount" min="0.2" max="3" step="0.2" value="1">
        </div>
        <div class="setting-row">
            <label>Flow Speed</label>
            <input type="range" id="flowSpeed" min="0.1" max="4" step="0.1" value="1">
        </div>
    </div>
    <div id="settings-cosmic" class="setting-group">
        <div class="setting-row">
            <label>Star Density</label>
            <input type="range" id="cosmicCount" min="0.2" max="3" step="0.2" value="1">
        </div>
        <div class="setting-row">
            <label>Warp Speed</label>
            <input type="range" id="cosmicSpeed" min="1" max="40" step="1" value="8">
        </div>
    </div>
    <div id="settings-win11" class="setting-group">
        <div class="setting-row">
            <label>Spinner Speed</label>
            <input type="range" id="win11Speed" min="0.2" max="3" step="0.1" value="1">
        </div>
    </div>
    <div id="settings-matrix" class="setting-group">
        <div class="setting-row">
            <label>Rain Speed</label>
            <input type="range" id="matrixSpeed" min="0.2" max="3" step="0.1" value="1">
        </div>
    </div>
    <div id="settings-neon" class="setting-group">
        <div class="setting-row">
            <label>Wave Count</label>
            <input type="range" id="neonCount" min="1" max="10" step="1" value="3">
        </div>
        <div class="setting-row">
            <label>Wave Speed</label>
            <input type="range" id="neonSpeed" min="0.1" max="4" step="0.1" value="1">
        </div>
    </div>
    <div id="settings-fireworks" class="setting-group">
        <div class="setting-row">
            <label>Explosion Frequency</label>
            <input type="range" id="fwFreq" min="0.2" max="3" step="0.2" value="1">
        </div>
    </div>
    <div id="settings-bouncing" class="setting-group">
        <div class="setting-row">
            <label>Bounce Speed</label>
            <input type="range" id="bounceSpeed" min="0.5" max="5" step="0.5" value="2">
        </div>
        <div class="setting-row">
            <label>Text Size</label>
            <input type="range" id="bounceSize" min="20" max="150" step="5" value="60">
        </div>
    </div>
    <div id="settings-synthwave" class="setting-group">
        <div class="setting-row">
            <label>Grid Density</label>
            <input type="range" id="synthDensity" min="20" max="100" step="10" value="40">
        </div>
        <div class="setting-row">
            <label>Movement Speed</label>
            <input type="range" id="synthSpeed" min="0.1" max="3" step="0.1" value="1">
        </div>
    </div>
    <div id="settings-tunnel" class="setting-group">
        <div class="setting-row">
            <label>Tunnel Speed</label>
            <input type="range" id="tunnelSpeed" min="0.5" max="5" step="0.5" value="1.5">
        </div>
    </div>
    <div id="settings-ripples" class="setting-group">
        <div class="setting-row">
            <label>Rain Intensity</label>
            <input type="range" id="rippleFreq" min="0.2" max="3" step="0.2" value="1">
        </div>
    </div>

    <button id="startBtn">Launch Screensaver</button>
</div>

<canvas id="canvas"></canvas>
<script src="script.js"></script>
</body>
</html>
